[project]
name = "engine-backtest"
version = "0.1.0"
description = "محرك الإعادة، التكاليف، الوسم، المقاييس (§25-§26, §30)"
requires-python = ">=3.12"
dependencies = ["engine-schemas", "engine-common", "engine-math", "engine-features"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest"]
