[project]
name = "engine-math"
version = "0.1.0"
description = "رياضيات نقية: ATR، مئينيات، z-scores، تشبع — لا تستورد أي حزمة مشروع"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantmath"]
