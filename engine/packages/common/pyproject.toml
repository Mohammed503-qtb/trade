[project]
name = "engine-common"
version = "0.1.0"
description = "وقت-حدث، معرفات، سجلات منظمة، hot-state (§47 packages/common)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "structlog>=24.4", "prometheus-client>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
