# ══════════════════════════════════════════════════════════════════
# alembic.ini — إعدادات الهجرة (المهمة 0.6، قرار D-10)
#
# القاعدة §37.1: لا سرّ ولا URL اتصال في أي ملف يُلتزم في git.
# رابط قاعدة البيانات يُضبط برمجيًا داخل migrations/env.py من
# common.config.load_settings() (متغير ENGINE_DATABASE_URL أو قيمته
# الافتراضية)، مع إمكانية تجاوزه وقت التشغيل عبر:
#   alembic -x sqlalchemy.url=postgresql://... upgrade head
#
# خدمة migrate (supervisor وcompose) تستدعي `alembic upgrade head`
# من جذر engine/ — لذا script_location نسبي لهذا الجذر.
# ══════════════════════════════════════════════════════════════════

[alembic]
script_location = migrations

# يُضبط برمجيًا في migrations/env.py — لا تضعه هنا أبدًا (§37.1)
# sqlalchemy_url =

# ─── تسجيل السجلات (يقرؤها fileConfig من env.py) ───

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
