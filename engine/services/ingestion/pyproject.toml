[project]
name = "engine-ingestion"
version = "0.1.0"
description = "محول Binance، تنقيح، جودة، بناء شموع (§7, §8)"
requires-python = ">=3.12"
dependencies = [
    "engine-schemas",
    "engine-common",
    "httpx>=0.28",
    # المخزن الخام (المهمة 1.5): Parquet + S3 + ميتاداتا PG — تبعيات تشغيل فعلية
    "pyarrow>=17",
    "minio>=7.2",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
