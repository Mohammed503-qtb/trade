[project]
name = "engine-ingestion"
version = "0.1.0"
description = "محول Binance، تنقيح، جودة، بناء شموع (§7, §8)"
requires-python = ">=3.12"
dependencies = ["engine-schemas", "engine-common", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
