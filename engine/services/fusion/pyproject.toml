[project]
name = "engine-fusion"
version = "0.1.0"
description = "دمج الدليل، ارتباط، تناقض (§19)"
requires-python = ">=3.12"
dependencies = ["engine-schemas", "engine-common", "engine-features"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]
