[project]
name = "engine-scenarios"
version = "0.1.0"
description = "مقترحات + دورة حياة + مشغلات (§18)"
requires-python = ">=3.12"
dependencies = ["engine-schemas", "engine-common", "engine-features"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenarios"]
