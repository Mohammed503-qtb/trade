[project]
name = "engine-patterns"
version = "0.1.0"
description = "شموع + كلاسيكي (§13) — الهارمونيك (§14) مؤجل صراحة بعد MVP"
requires-python = ">=3.12"
dependencies = ["engine-schemas", "engine-common", "engine-features"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patterns"]
