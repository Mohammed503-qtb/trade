[project]
name = "engine-api"
version = "0.1.0"
description = "FastAPI: webhook، حالة، سيناريوهات (§5.5)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "engine-schemas", "engine-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine_api"]
